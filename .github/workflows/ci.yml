name: Fastapi ci

on:
    push:
        branches:
            - main

jobs:
    test:

        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repositories
              uses: actions/checkout@v4
            
            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            
            - name: install dependencies
              run: | 
                 python -m pip install --upgrade pip
                 pip install -r server/requirements.txt
            
            - name: Run Tests
              run: | 
                echo "Running tests..."     